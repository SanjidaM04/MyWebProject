<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>COMP 2680 – Assignment 10: Form Events</title>
  <style>
    :root {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: #b91c1c;
    }

    body {
      margin: 0;
      padding: 2.5rem 1.5rem 3rem;
      min-height: 100vh;
      background: #b91c1c;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      position: relative;
    }

    h1::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -0.75rem;
      width: 80px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0f4c81, #f97316);
    }

    form {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      color: #1f2933;
      padding: 2rem;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(15, 52, 96, 0.25);
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(6px);
    }

    .form-highlight {
      background: #000000;
      color: #ffffff;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
    }

    .form-highlight label,
    .form-highlight legend,
    .form-highlight p,
    .form-highlight span {
      color: #ffffff;
    }

    fieldset {
      border: 1px solid #e1e7ef;
      border-radius: 12px;
      margin-bottom: 1.75rem;
      padding: 1.25rem;
      position: relative;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(249, 251, 255, 0.9));
    }

    fieldset::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(15, 76, 129, 0.15), rgba(249, 115, 22, 0.15));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    legend {
      font-weight: bold;
      color: #1f2933;
      padding: 0 0.5rem;
    }

    label {
      display: block;
      margin-top: 0.75rem;
      font-weight: 600;
      color: #1f2933;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem;
      margin-top: 0.35rem;
      border: 1px solid #d4dbe3;
      border-radius: 8px;
      font-size: 1rem;
      background: #f8fafc;
      color: #1f2933;
      transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0f4c81;
      box-shadow: 0 5px 20px rgba(15, 76, 129, 0.15);
      transform: translateY(-1px);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 0.85rem;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      background: #0f4c81;
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s ease;
      box-shadow: 0 10px 20px rgba(15, 76, 129, 0.25);
    }

    button[type="reset"] {
      background: #9aa5b1;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(15, 76, 129, 0.28);
    }

    .form-highlight input,
    .form-highlight select,
    .form-highlight textarea {
      background: #111827;
      color: #ffffff;
      border-color: #facc15;
    }

    .messages {
      max-width: 640px;
      margin: 1.5rem auto;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      color: #ffffff;
    }

    .messages p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .char-hint {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 0.25rem;
    }

    .form-highlight .char-hint {
      color: #e5e7eb;
    }

    .accent-cyan {
      color: #06b6d4;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.35);
    }

    .accent-gold {
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.35);
    }

    .form-highlight .accent-cyan {
      color: #5eead4;
    }

    .form-highlight .accent-gold {
      color: #fcd34d;
    }

    .age-focused {
      font-size: 1.1rem;
      border-color: #0f4c81;
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
    }
  </style>
</head>
<body>
  <h1 class="accent-cyan" ondblclick="changeHeadingText(this)">Smart Registration Form</h1>

  <!-- Enhancement 1: Form background glows when hovered to guide the user -->
  <form id="registrationForm">
    <fieldset>
      <legend class="accent-cyan">Basic Information</legend>
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="e.g., Ada Lovelace"
        onfocus="displayInlineMessage('Full Name field is focused.')"
      />

      <label for="email">Email</label>
      <input
        type="text"
        id="email"
        name="email"
        placeholder="name@example.com"
        onblur="displayInlineMessage('Email field lost focus.')"
      />

      <label for="age">Age</label>
      <!-- Enhancement 2: Age field grows slightly on focus so it stands out -->
      <input type="number" id="age" name="age" placeholder="18" />
    </fieldset>

    <fieldset>
      <legend class="accent-cyan">Preferences</legend>
      <label class="accent-cyan" for="course">Favorite Course</label>
      <select id="course" name="course">
        <option value="" disabled selected>Select a course</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
      </select>

      <p class="accent-cyan">Mode of Study</p>
      <label>
        <input type="radio" name="mode" value="Online" /> Online
      </label>
      <label>
        <input type="radio" name="mode" value="In-Person" /> In-Person
      </label>
    </fieldset>

    <fieldset>
      <legend class="accent-cyan">Other</legend>
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4" placeholder="Share any notes..."></textarea>
      <p class="char-hint">Characters typed: <span id="charCount">0</span></p>
    </fieldset>

    <div class="controls">
      <button type="submit" id="submitBtn">Submit</button>
      <button type="reset">Reset</button>
    </div>
  </form>

  <section class="messages">
    <p id="inlineMessage">Inline events: waiting for interaction.</p>
    <p id="listenerMessage">Event listeners: waiting for interaction.</p>
  </section>

  <script>
    const inlineMessage = document.getElementById('inlineMessage');
    const listenerMessage = document.getElementById('listenerMessage');
    const form = document.getElementById('registrationForm');
    const courseSelect = document.getElementById('course');
    const comments = document.getElementById('comments');
    const charCount = document.getElementById('charCount');
    const submitButton = document.getElementById('submitBtn');
    const ageInput = document.getElementById('age');

    function displayInlineMessage(text) {
      inlineMessage.textContent = text;
    }

    function changeHeadingText(element) {
      element.textContent = 'Welcome to Smart Registration!';
      displayInlineMessage('Heading updated to welcome message.');
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      listenerMessage.textContent = 'Form submitted (demo only).';
    });

    form.addEventListener('reset', () => {
      listenerMessage.textContent = 'Form cleared.';
      inlineMessage.textContent = 'Form reset triggered.';
      charCount.textContent = '0';
    });

    courseSelect.addEventListener('change', (event) => {
      listenerMessage.textContent = `Selected course: ${event.target.value}`;
    });

    comments.addEventListener('input', (event) => {
      const count = event.target.value.length;
      charCount.textContent = count;
      listenerMessage.textContent = `Comments field now has ${count} character(s).`;
    });

    submitButton.addEventListener('click', () => {
      listenerMessage.textContent = 'Submit button click listener fired.';
    });

    form.addEventListener('mouseenter', () => {
      form.classList.add('form-highlight');
    });

    form.addEventListener('mouseleave', () => {
      form.classList.remove('form-highlight');
    });

    ageInput.addEventListener('focus', () => {
      ageInput.classList.add('age-focused');
      listenerMessage.textContent = 'Age field is ready for input.';
    });

    ageInput.addEventListener('blur', () => {
      ageInput.classList.remove('age-focused');
    });
  </script>
</body>
</html>
